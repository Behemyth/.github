name: Native Check

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by PDM and the project tooling.
        type: string
        default: "3.15"
      fast-runner:
        description: Runner label for the fast stage.
        type: string
        default: ubuntu-26.04
      fast-install:
        description: Dependency installation command for the fast stage.
        type: string
        default: pdm install
      fast-command:
        description: Cheap checks required alongside the native lanes.
        type: string
        required: true
      fast-uses-cmake:
        description: Install the pinned CMake before the fast stage.
        type: boolean
        default: false
      native-identities:
        description: >-
          JSON array of canonical build identity names. Leave empty to run every identity
          in the canonical table.
        type: string
        default: ""
      target-identity:
        description: Run only this declared identity for a non-required manual check.
        type: string
        default: ""
      targeted:
        description: Require exactly one target for a manual development check.
        type: boolean
        default: false
      native-mode:
        description: Use committed CMake workflows or a project-wide command.
        type: string
        default: cmake
      native-install:
        description: Python dependency installation command for native jobs.
        type: string
        default: pdm install
      native-prepare:
        description: Prepare native dependencies before CMake workflows.
        type: string
        default: pdm run prepare
      native-command:
        description: Project-wide native command used in command mode.
        type: string
        default: pdm run test
      configuration-repository:
        description: Public configuration fork containing the canonical identity table.
        type: string
        default: Behemyth/configuration
      configuration-ref:
        description: >-
          Configuration fork branch, tag, or commit containing the identity table. Leave empty
          to use the template revision recorded in the caller's .copier-answers.yml.
        type: string
        default: ""
      cmake-version:
        description: Exact CMake release to install for every native lane.
        type: string
        default: 4.5.0-rc2
      llvm-version:
        description: Upstream LLVM major version for llvm-libcxx lanes.
        type: string
        default: "23"
      strict-warnings:
        description: >-
          Treat compiler warnings as errors by exporting SYNODIC_STRICT_WARNINGS, which the
          shared CMake presets map to CMAKE_COMPILE_WARNING_AS_ERROR. Local builds leave it unset.
        type: boolean
        default: true

permissions:
  contents: read

env:
  SYNODIC_STRICT_WARNINGS: ${{ inputs.strict-warnings && 'ON' || 'OFF' }}

jobs:
  fast:
    name: fast
    runs-on: ${{ inputs.fast-runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: true

      - name: Install pinned CMake
        if: inputs.fast-uses-cmake
        shell: bash
        env:
          CMAKE_VERSION: ${{ inputs.cmake-version }}
        run: &install-cmake |
          python - <<'PY'
          import hashlib
          import os
          import platform
          import shutil
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          version = os.environ["CMAKE_VERSION"]
          checksums = {
              "4.5.0-rc2": {
                  "linux-aarch64.tar.gz": "eb9e34098b07e1b86bd744a624c67cda19bf3be800e6baea702e9c01305c7663",
                  "linux-x86_64.tar.gz": "5d763a6b0b1ab67588734f14734dec1a3957b491750b46804b2a13b9e9e0a75a",
                  "macos-universal.tar.gz": "864c2536079578a88705000254b1a0fac2eb8e84f5ee4c53ee231b5884283cb6",
                  "windows-arm64.zip": "66d323b85c00e66ec9fc0965d67eb944d2ec2e5b0b217d325f8ac93878ea5da1",
                  "windows-x86_64.zip": "251e58d8e9e4c257e305b9cabb59abe0389d3790fc28d4269306e5197f01c372",
              }
          }
          system = platform.system()
          machine = platform.machine().lower()
          if system == "Linux" and machine in {"x86_64", "amd64"}:
              asset = "linux-x86_64.tar.gz"
              binary = "bin/cmake"
          elif system == "Linux" and machine in {"aarch64", "arm64"}:
              asset = "linux-aarch64.tar.gz"
              binary = "bin/cmake"
          elif system == "Darwin":
              asset = "macos-universal.tar.gz"
              binary = "CMake.app/Contents/bin/cmake"
          elif system == "Windows" and machine in {"x86_64", "amd64"}:
              asset = "windows-x86_64.zip"
              binary = "bin/cmake.exe"
          elif system == "Windows" and machine in {"arm64", "aarch64"}:
              asset = "windows-arm64.zip"
              binary = "bin/cmake.exe"
          else:
              raise SystemExit(f"No pinned CMake archive for {system}/{machine}")

          try:
              expected = checksums[version][asset]
          except KeyError as error:
              raise SystemExit(f"CMake {version} has no pinned checksum for {asset}") from error

          archive_name = f"cmake-{version}-{asset}"
          temp = Path(os.environ["RUNNER_TEMP"])
          archive = temp / archive_name
          url = f"https://github.com/Kitware/CMake/releases/download/v{version}/{archive_name}"
          with urllib.request.urlopen(url, timeout=120) as response, archive.open("wb") as output:
              shutil.copyfileobj(response, output)

          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Checksum mismatch for {archive_name}: {actual}")

          destination = temp / f"cmake-{version}"
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir()
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive) as package:
                  package.extractall(destination)
          else:
              with tarfile.open(archive) as package:
                  package.extractall(destination, filter="data")

          roots = [path for path in destination.iterdir() if path.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f"Expected one CMake archive root, found {roots}")
          cmake = roots[0] / binary
          if not cmake.is_file():
              raise SystemExit(f"CMake executable missing from archive: {cmake}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"CMAKE_BINARY={cmake}\n")
          PY

      - name: Install dependencies
        shell: bash
        run: ${{ inputs.fast-install }}

      - name: Run fast checks
        shell: bash
        run: ${{ inputs.fast-command }}

      - name: Summarize fast stage
        if: always()
        shell: bash
        run: |
          {
            echo "### Fast stage"
            echo "- Runner: ${{ runner.os }} ${{ runner.arch }} ($ImageOS $ImageVersion)"
            echo "- Python: $(python --version 2>&1)"
            if [[ -n "${CMAKE_BINARY:-}" ]]; then
              python -c 'import os, subprocess; print("- CMake: " + subprocess.run([os.environ["CMAKE_BINARY"], "--version"], check=True, capture_output=True, text=True).stdout.splitlines()[0])'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  preflight:
    name: matrix preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout this workflow's exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .native-workflow
          persist-credentials: false

      - name: Install PDM and Python
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: false

      - name: Checkout canonical configuration
        shell: bash
        env:
          CONFIGURATION_REPOSITORY: ${{ inputs.configuration-repository }}
          CONFIGURATION_REF: ${{ inputs.configuration-ref }}
        run: |
          python .native-workflow/.github/scripts/native_matrix.py configuration \
            --repository "$CONFIGURATION_REPOSITORY" \
            --ref "$CONFIGURATION_REF" \
            --answers .copier-answers.yml \
            --destination .native-configuration

      - name: Validate first-party pins
        shell: bash
        run: |
          python .native-workflow/.github/scripts/first_party.py validate \
            --pins tool/first-party.toml \
            --repository "$GITHUB_REPOSITORY" \
            --checkouts "$RUNNER_TEMP/first-party"

      - name: Install template renderer
        run: python -m pip install "jinja2>=3.1,<4"

      - name: Validate identities and resolve runners
        id: resolve
        shell: bash
        env:
          IDENTITIES: ${{ inputs.native-identities }}
          TARGET_IDENTITY: ${{ inputs.target-identity }}
          TARGETED: ${{ inputs.targeted }}
          NATIVE_MODE: ${{ inputs.native-mode }}
        run: |
          if [[ "$TARGETED" == "true" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Targeted checks are only permitted for workflow_dispatch" >&2
            exit 1
          fi
          python .native-workflow/.github/scripts/native_matrix.py resolve \
            --configuration .native-configuration \
            --consumer tool/identities.toml \
            --selection "$IDENTITIES" \
            --target "$TARGET_IDENTITY" \
            --targeted "$TARGETED" \
            --mode "$NATIVE_MODE"

  native:
    name: native (${{ matrix.identity }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NATIVE_IDENTITY: ${{ matrix.identity }}
      NATIVE_TOOLCHAIN: ${{ matrix.toolchain }}
      NATIVE_WORKSPACE: ${{ github.workspace }}
    defaults:
      run:
        working-directory: ${{ env.NATIVE_WORKSPACE }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout this workflow's exact revision
        id: workflow-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .native-workflow
          persist-credentials: false

      - name: Create Windows Dev Drive
        id: dev-drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4
        with:
          drive-size: 16GB
          drive-path: ${{ runner.temp }}\native-dev-drive.vhdx
          workspace-copy: true
          native-dev-drive: true
          trusted-dev-drive: true

      - name: Select Windows Dev Drive workspace
        id: workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $volume = Get-Volume -FilePath $env:DEV_DRIVE_WORKSPACE
          if ($volume.FileSystem -ne 'ReFS') { throw 'The Windows native workspace is not on ReFS.' }
          fsutil devdrv query $env:DEV_DRIVE_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'The Windows native workspace is not on a Dev Drive.' }
          "NATIVE_WORKSPACE=$env:DEV_DRIVE_WORKSPACE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONAN_HOME=$(Join-Path $env:DEV_DRIVE 'conan-home')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global --add safe.directory $env:DEV_DRIVE_WORKSPACE

      - name: Register compiler problem matchers
        id: matchers
        shell: bash
        run: echo "::add-matcher::$NATIVE_WORKSPACE/.native-workflow/.github/matchers/native.json"

      - name: Install PDM
        id: pdm
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: true

      - name: Install pinned CMake
        id: cmake-setup
        shell: bash
        env:
          CMAKE_VERSION: ${{ inputs.cmake-version }}
        run: *install-cmake

      - name: Install upstream LLVM on Ubuntu
        id: llvm-linux
        if: matrix.toolchain == 'llvm-libcxx' && runner.os == 'Linux'
        shell: bash
        env:
          LLVM_VERSION: ${{ inputs.llvm-version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/apt.llvm.org.asc"
          keyring="$RUNNER_TEMP/apt.llvm.org.gpg"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$key"
          fingerprint="$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ "$fingerprint" != "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421" ]]; then
            echo "Unexpected apt.llvm.org key fingerprint: $fingerprint" >&2
            exit 1
          fi
          gpg --dearmor --output "$keyring" "$key"
          sudo install -D -m 0644 "$keyring" /etc/apt/keyrings/apt.llvm.org.gpg
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "clang-${LLVM_VERSION}" "libc++-${LLVM_VERSION}-dev" "libc++abi-${LLVM_VERSION}-dev" "lld-${LLVM_VERSION}" \
            "libclang-rt-${LLVM_VERSION}-dev"
          echo "LLVM_ROOT=/usr/lib/llvm-${LLVM_VERSION}" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install upstream LLVM on macOS
        id: llvm-macos
        if: matrix.toolchain == 'llvm-libcxx' && runner.os == 'macOS'
        shell: bash
        env:
          LLVM_VERSION: ${{ inputs.llvm-version }}
        run: |
          set -euo pipefail
          # Homebrew ships the newest LLVM major as the unversioned formula.
          formula="llvm"
          if brew info --json=v2 "llvm@${LLVM_VERSION}" >/dev/null 2>&1; then
            formula="llvm@${LLVM_VERSION}"
          fi
          brew install "$formula"
          root="$(brew --prefix "$formula")"
          major="$("$root/bin/clang" -dumpversion | cut -d. -f1)"
          if [[ "$major" != "$LLVM_VERSION" ]]; then
            echo "Homebrew $formula provides LLVM $major, expected $LLVM_VERSION" >&2
            exit 1
          fi
          echo "LLVM_ROOT=$root" >> "$GITHUB_ENV"
          # Homebrew installs the manifest beside its libc++, where clang -print-file-name does not search.
          modules_json="$root/lib/c++/libc++.modules.json"
          if [[ ! -f "$modules_json" ]]; then
            echo "Homebrew $formula does not provide $modules_json" >&2
            exit 1
          fi
          echo "SYNODIC_CXX_STDLIB_MODULES_JSON=$modules_json" >> "$GITHUB_ENV"
          echo "$root/bin" >> "$GITHUB_PATH"

      - name: Load MSVC developer environment
        id: msvc
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $target = switch ($env:RUNNER_ARCH) {
            'X64' { @{ Component = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'; Script = 'vcvars64.bat'; Host = 'x64'; Triple = 'X86_64' } }
            'ARM64' { @{ Component = 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'; Script = 'vcvarsarm64.bat'; Host = 'arm64'; Triple = 'AARCH64' } }
            default { throw "Unsupported Windows runner architecture: $env:RUNNER_ARCH" }
          }
          $installation = & $vswhere -latest -prerelease -products * -requires $target.Component -property installationPath
          if (-not $installation) { throw "No Visual Studio installation with $($target.Component) was found." }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\$($target.Script)"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = & $env:ComSpec /d /s /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "$($target.Script) failed with exit code $LASTEXITCODE" }
          foreach ($line in $lines) {
            $name, $value = $line -split '=', 2
            if ($name -and $before[$name] -ne $value) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
            if ($name -eq 'VCToolsInstallDir') { $toolsDir = $value }
          }
          # Bash steps put Git's /usr/bin/link ahead of MSVC, which breaks Rust builds of Python wheels.
          if (-not $toolsDir) { throw "$($target.Script) did not set VCToolsInstallDir" }
          $hostDir = "Host$($target.Host)"
          $linker = Join-Path $toolsDir "bin\$hostDir\$($target.Host)\link.exe"
          if (-not (Test-Path -LiteralPath $linker)) { throw "MSVC linker not found: $linker" }
          "CARGO_TARGET_$($target.Triple)_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify runner and compiler identity
        id: identity
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_COMPILER: ${{ matrix.compiler }}
          LLVM_VERSION: ${{ inputs.llvm-version }}
        run: |
          python .native-workflow/.github/scripts/native_matrix.py verify \
            --identity "$NATIVE_IDENTITY" --os "$EXPECTED_OS" \
            --arch "$EXPECTED_ARCH" --compiler "$EXPECTED_COMPILER" \
            --llvm-version "$LLVM_VERSION"

      - name: Configure isolated Conan profile
        id: conan-profile
        shell: bash
        env:
          LLVM_VERSION: ${{ inputs.llvm-version }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          home = Path(os.environ["CONAN_HOME"]) if "CONAN_HOME" in os.environ else Path(os.environ["RUNNER_TEMP"]) / "conan-home"
          profiles = home / "profiles"
          profiles.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"CONAN_HOME={home}\n")

          if os.environ["TOOLCHAIN"] == "msvc":
              raise SystemExit(0)
          if os.environ["TOOLCHAIN"] != "llvm-libcxx":
              raise SystemExit(f"Unsupported toolchain: {os.environ['TOOLCHAIN']}")

          (home / "settings_user.yml").write_text(
              f'compiler:\n  clang:\n    version: ["{os.environ["LLVM_VERSION"]}"]\n',
              encoding="utf-8",
          )
          root = Path(os.environ["LLVM_ROOT"])
          system = platform.system()
          conan_os = {"Linux": "Linux", "Darwin": "Macos"}[system]
          conan_arch = {"x86_64": "x86_64", "amd64": "x86_64", "arm64": "armv8", "aarch64": "armv8"}[
              platform.machine().lower()
          ]
          executables = {"c": str(root / "bin/clang"), "cpp": str(root / "bin/clang++")}
          lines = [
              "[settings]",
              f"os={conan_os}",
              f"arch={conan_arch}",
              "build_type=Release",
              "compiler=clang",
              f"compiler.version={os.environ['LLVM_VERSION']}",
              "compiler.libcxx=libc++",
              "compiler.cppstd=23",
              "[conf]",
              f"tools.build:compiler_executables={json.dumps(executables)}",
          ]
          if system == "Darwin":
              link_flags = [
                  f"-L{root / 'lib/c++'}",
                  f"-Wl,-rpath,{root / 'lib/c++'}",
                  f"-L{root / 'lib/unwind'}",
                  "-lunwind",
              ]
              lines.extend(
                  [
                      f"tools.build:exelinkflags={json.dumps(link_flags)}",
                      f"tools.build:sharedlinkflags={json.dumps(link_flags)}",
                  ]
              )
          profile = "\n".join(lines) + "\n"
          for name in ("default", "build"):
              (profiles / name).write_text(profile, encoding="utf-8")
          PY

      - name: Restore Conan package cache
        id: conan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ matrix.identity }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile*.py', 'pyproject.toml', 'pdm.lock', 'tool/first-party.toml') }}
          restore-keys: |
            conan-${{ matrix.identity }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        id: install
        shell: bash
        env:
          NATIVE_CHECK_COMMAND: ${{ inputs.native-install }}
        run: python .native-workflow/.github/scripts/native_check.py run --shell "$BASH" --stage install

      # No remote serves first-party packages yet, so each lane exports their pinned recipes.
      - name: Export pinned first-party recipes
        id: first-party
        if: hashFiles('tool/first-party.toml') != ''
        shell: bash
        env:
          NATIVE_CHECK_COMMAND: >-
            pdm run python .native-workflow/.github/scripts/first_party.py export
            --pins tool/first-party.toml
            --checkouts "$RUNNER_TEMP/first-party"
            --output "build/native-check/$NATIVE_IDENTITY"
        run: python .native-workflow/.github/scripts/native_check.py run --shell "$BASH" --stage first-party

      - name: Prepare native dependencies
        id: prepare
        if: inputs.native-mode == 'cmake'
        shell: bash
        env:
          CPPYTHON_IDENTITY: ${{ matrix.identity }}
          NATIVE_CHECK_COMMAND: ${{ inputs.native-prepare }}
        run: python .native-workflow/.github/scripts/native_check.py run --shell "$BASH" --stage prepare

      - name: Run committed CMake steps and single-config configure checks
        id: cmake
        if: inputs.native-mode == 'cmake'
        shell: bash
        env:
          CONFIGURATIONS: ${{ join(matrix.configurations, ' ') }}
        run: pdm run python .native-workflow/.github/scripts/native_check.py cmake --configurations $CONFIGURATIONS

      - name: Run project-wide native command
        id: native-command
        if: inputs.native-mode == 'command'
        shell: bash
        env:
          NATIVE_CHECK_COMMAND: ${{ inputs.native-command }}
        run: python .native-workflow/.github/scripts/native_check.py run --shell "$BASH" --stage native-command

      # Pull-request and manual runs save for their own ref. The merge queue never saves.
      - name: Trim the Conan package cache
        id: conan-cache-trim
        if: >-
          success() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
          && steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ -d "$CONAN_HOME/p" ]]; then
            pdm run conan cache clean "*" --source --build --download --temp
          fi

      - name: Save Conan package cache
        id: conan-cache-save
        if: >-
          success() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
          && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

      - name: Summarize native lane
        id: tool-summary
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.identity }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          {
            echo "### Native lane: $LANE"
            echo "- Runner: ${{ runner.os }} ${{ runner.arch }} ($ImageOS $ImageVersion)"
            echo "- Toolchain: $TOOLCHAIN"
            echo "- Strict warnings: $SYNODIC_STRICT_WARNINGS"
            python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          binary = os.environ.get("CMAKE_BINARY")
          if binary and Path(binary).is_file():
              version = subprocess.run([binary, "--version"], check=True, capture_output=True, text=True).stdout.splitlines()[0]
              digest = hashlib.sha256(Path(binary).read_bytes()).hexdigest()
              print(f"- CMake: {version}, origin `environment`, SHA-256 `{digest}`")

          home = os.environ.get("CONAN_HOME")
          profile = Path(home, "profiles", "default") if home else None
          if profile and profile.is_file():
              print("- Conan profile:")
              print("```ini")
              print(profile.read_text(encoding="utf-8").rstrip())
              print("```")
          PY
            if [[ -n "${LLVM_ROOT:-}" && -x "$LLVM_ROOT/bin/clang++" ]]; then
              echo "- Compiler: $("$LLVM_ROOT/bin/clang++" --version | head -n 1)"
            fi
            if [[ "$TOOLCHAIN" == "msvc" ]]; then
              vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
              if [[ -x "$vswhere" ]]; then
                echo "- Visual Studio: $("$vswhere" -latest -prerelease -products '*' -property catalog_productDisplayVersion)"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish structured native result
        if: always()
        shell: bash
        env:
          NATIVE_STEP_RESULTS: ${{ toJSON(steps) }}
        run: python .native-workflow/.github/scripts/native_check.py report --job-status "${{ job.status }}"

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.identity }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_WORKSPACE }}/build/native-check/${{ matrix.identity }}
          if-no-files-found: error
          retention-days: 7

  ci-result:
    name: ci-result
    if: always()
    needs: [fast, preflight, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Require every stage to succeed
        shell: bash
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          echo "fast=$FAST_RESULT preflight=$PREFLIGHT_RESULT native=$NATIVE_RESULT"
          [[ "$FAST_RESULT" == "success" && "$PREFLIGHT_RESULT" == "success" && "$NATIVE_RESULT" == "success" ]]
