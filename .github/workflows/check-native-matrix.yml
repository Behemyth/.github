name: Check Native Matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test tools
        run: python -m pip install "cmake==4.4.4" "ninja==1.13.0"
      - name: Test matrix and native result contracts
        run: python -m unittest discover -s tests -v
